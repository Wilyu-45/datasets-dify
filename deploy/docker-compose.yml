# ═══════════════════════════════════════════
# Docker Compose 编排文件（生产环境）
# 
# ★ 生产定位（2026-09 起）：
#   - 数据库：MySQL 8.0（方言适配层自动建表/upsert，无需手工建库建表）
#   - MinerU：官方网页端 API（mineru.net，异步任务制；本地部署改用 RAG_MINERU_PROVIDER=local）
#   - 存储清理：定时任务默认开启（保留源文件 + 解析产物，清理中间产物）
# 
# 用法：
#   docker compose -f deploy/docker-compose.yml up -d --build    # 启动
#   docker compose -f deploy/docker-compose.yml down              # 停止
#   docker compose -f deploy/docker-compose.yml logs -f          # 查看日志
# 
# 可选：兼容模式（改用容器内 PostgreSQL，默认 MySQL 不启动）：
#   DB_TYPE=postgres docker compose -f deploy/docker-compose.yml --profile postgres up -d
#   （PowerShell: $env:DB_TYPE="postgres"; docker compose -f deploy/docker-compose.yml --profile postgres up -d）
# ═══════════════════════════════════════════

services:
  # ──── 后端服务（FastAPI）─────────────────────
  backend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.backend
      args:
        BUILD_DATE: ${BUILD_DATE:-$(date -u +'%Y-%m-%dT%H:%M:%SZ')}
        VCS_REF: ${VCS_REF:-$(git rev-parse --short HEAD 2>/dev/null || echo "unknown")}
    image: ragsystem-backend:${TAG:-latest}
    container_name: ragsystem-backend
    restart: unless-stopped
    
    # 注入生产配置（宿主机上的 backend/.env，模板见 backend/.env.production.example）
    # ★ 配置生效机制说明：
    #   1) 后端代码只读容器内 <repo>/backend/.env（dotenv，优先于进程环境变量）；
    #   2) 镜像只 COPY 了 backend/app，容器内并不存在 .env 文件，
    #      因此 dotenv source 读不到值，自动回退到进程环境变量；
    #   3) 这里的 env_file 就是把 backend/.env 的内容注入为容器进程环境变量，从而生效。
    #   ⇒ 若用 volume 把整个仓库挂载进容器（含 backend/.env），则容器内 .env 优先，
    #     下方 environment 将无法覆盖它，请注意二者的取舍。
    env_file:
      - ../backend/.env
    
    # 环境变量（覆盖 env_file 中的值 —— 容器网络下 127.0.0.1 指向容器自身，
    # 数据库主机必须改用 compose 服务名 mysql）
    environment:
      - RAG_DATA_ROOT=/opt/ragsystem/data
      - RAG_LOG_LEVEL=${RAG_LOG_LEVEL:-info}
      
      # ★ 数据库：生产默认 MySQL（RAG_DB_TYPE=mysql 时后端自动按 MySQL 方言建表/upsert）
      #   主机指向 compose 内的 mysql 服务，而非 backend/.env 里的 127.0.0.1
      - RAG_DB_TYPE=${DB_TYPE:-mysql}
      - RAG_MYSQL_HOST=${MYSQL_SERVICE_HOST:-mysql}
      - RAG_MYSQL_PORT=${MYSQL_PORT:-3306}
      - RAG_MYSQL_DBNAME=${MYSQL_DBNAME:-ragsystem_production}
      - RAG_MYSQL_USER=${MYSQL_USER:-ragsystem_app}
      - RAG_MYSQL_PASSWORD=${MYSQL_PASSWORD:-ragsystem_password}
      
      # ★ MinerU：生产默认官方网页端 API（mineru.net）
      #   RAG_MINERU_NET_TOKEN 等详细参数由 backend/.env 注入；
      #   此处仅兜底 provider 默认值（可改 deploy/.env 或宿主机环境变量覆盖回 local）
      - RAG_MINERU_PROVIDER=${MINERU_PROVIDER:-mineru_net}
      
      # ★ 存储清理：定时任务由 RAG_CLEANUP_* 控制（默认开启，24h 周期），
      #   参数由 backend/.env 注入，如需覆盖取消下行注释
      # - RAG_CLEANUP_SCHEDULE_HOURS=24
      
      # ★ 兼容模式（--profile postgres）下指向 postgres 服务；默认 MySQL 模式下该值不被读取
      - RAG_PG_HOST=${PG_SERVICE_HOST:-postgres}
    
    # Linux 下允许容器访问宿主机服务（本地 MinerU / 兼容模式等）
    extra_hosts:
      - "host.docker.internal:host-gateway"
    
    # 数据卷（持久化解析文件、chunks 等）
    volumes:
      - ragsystem_data:/opt/ragsystem/data
      - ragsystem_logs:/opt/ragsystem/backend/logs
    
    # 健康检查
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    
    # 资源限制（防止占用过多内存）
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 4G
        reservations:
          cpus: '1.0'
          memory: 1G
    
    # ★ 依赖数据库就绪后再启动（避免建表失败）
    depends_on:
      mysql:
        condition: service_healthy
    
    networks:
      - ragsystem-network

  # ──── 前端服务（React + Nginx）─────────────────
  frontend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
        BUILD_DATE: ${BUILD_DATE:-$(date -u +'%Y-%m-%dT%H:%M:%SZ')}
        VCS_REF: ${VCS_REF:-$(git rev-parse --short HEAD 2>/dev/null || echo "unknown")}
    image: ragsystem-frontend:${TAG:-latest}
    container_name: ragsystem-frontend
    restart: unless-stopped
    
    # 端口映射（仅用于独立部署，分离部署时由外部 Nginx 代理）
    ports:
      - ${FRONTEND_PORT:-80}:80
    
    # 健康检查
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    
    depends_on:
      backend:
        condition: service_started
    
    networks:
      - ragsystem-network

  # ──── MySQL 数据库（生产默认，8.0）──────────────
  mysql:
    image: mysql:8.0
    container_name: ragsystem-mysql
    restart: unless-stopped
    
    # 数据库初始化（仅首次启动创建；应用启动时幂等建表，无需手工建表）
    environment:
      MYSQL_DATABASE: ${MYSQL_DBNAME:-ragsystem_production}
      MYSQL_USER: ${MYSQL_USER:-ragsystem_app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-ragsystem_password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-ragsystem_root_password}
    
    # 数据持久化
    volumes:
      - mysql_data:/var/lib/mysql
      # 挂载自定义 init 脚本（可选）
      # - ./init-scripts:/docker-entrypoint-initdb.d
      # 自定义 my.cnf（可选）
      # - ./my.cnf:/etc/mysql/conf.d/custom.cnf:ro
    
    # 字符集 + 性能调优（容器环境）
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --max_connections=${MYSQL_MAX_CONNECTIONS:-200}
      --innodb_buffer_pool_size=${MYSQL_INNODB_BUFFER_POOL_SIZE:-512M}
    
    # 健康检查（mysqladmin ping 返回成功即视为就绪）
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    
    # 资源限制
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    
    networks:
      - ragsystem-network

  # ──── PostgreSQL 数据库（可选兼容模式，默认不启动）────────
  # 仅在使用 --profile postgres 时启动（同时需 DB_TYPE=postgres）；
  # 本地开发/兼容场景使用，生产默认走 MySQL。
  postgres:
    profiles: ["postgres"]
    image: postgres:15-alpine
    container_name: ragsystem-postgres
    restart: unless-stopped
    
    # 数据库初始化
    environment:
      POSTGRES_DB: ${PG_DBNAME:-ragsystem_production}
      POSTGRES_USER: ${PG_USER:-ragsystem_app}
      POSTGRES_PASSWORD: ${PG_PASSWORD:-ragsystem_password}
    
    # 数据持久化
    volumes:
      - pg_data:/var/lib/postgresql/data
      # 挂载自定义 init 脚本（可选）
      # - ./init-scripts:/docker-entrypoint-initdb.d
    
    # 性能调优（容器环境）
    command: >
      postgres
      -c max_connections=${PG_MAX_CONNECTIONS:-100}
      -c shared_buffers=${PG_SHARED_BUFFERS:-256MB}
      -c effective_cache_size=${PG_EFFECTIVE_CACHE_SIZE:-1GB}
      -c maintenance_work_mem=${PG_MAINTENANCE_WORK_MEM:-128MB}
      -c checkpoint_completion_target=0.9
      -c fsync=on
      -c wal_level=replica
      -c synchronous_commit=on
    
    # 健康检查
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-ragsystem_app} -d ${PG_DBNAME:-ragsystem_production}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    
    # 资源限制
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    
    networks:
      - ragsystem-network

  # ──── Nginx 反向代理（可选，生产环境推荐）────────
  nginx:
    image: nginx:alpine
    container_name: ragsystem-nginx
    restart: unless-stopped
    
    # 挂载 Nginx 配置
    volumes:
      - ./nginx-ragsystem.conf:/etc/nginx/conf.d/default.conf:ro
    
    # 端口映射
    ports:
      - ${NGINX_HTTP_PORT:-80}:80
      - ${NGINX_HTTPS_PORT:-443}:443
    
    # SSL 证书挂载（可选，生产环境需提前获取证书）
    # volumes:
    #   - ./ssl:/etc/nginx/ssl:ro
    
    # 健康检查
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
    
    depends_on:
      - backend
      - frontend
    
    networks:
      - ragsystem-network

# ──── 网络─────────────────────────────────────
networks:
  ragsystem-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

# ──── 数据卷─────────────────────────────────────
volumes:
  mysql_data:
    driver: local
    name: ragsystem_mysql_data
  
  pg_data:
    driver: local
    name: ragsystem_pg_data
  
  ragsystem_data:
    driver: local
    name: ragsystem_data
  
  ragsystem_logs:
    driver: local
    name: ragsystem_logs