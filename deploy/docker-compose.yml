# ═══════════════════════════════════════════
# Docker Compose 编排文件（生产环境）
# 
# 用法：
#   docker compose -f deploy/docker-compose.yml up -d --build    # 启动
#   docker compose -f deploy/docker-compose.yml down              # 停止
#   docker compose -f deploy/docker-compose.yml logs -f          # 查看日志
# ═══════════════════════════════════════════

version: '3.8'

services:
  # ──── 后端服务（FastAPI）─────────────────────
  backend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.backend
      args:
        BUILD_DATE: ${BUILD_DATE:-$(date -u +'%Y-%m-%dT%H:%M:%SZ')}
        VCS_REF: ${VCS_REF:-$(git rev-parse --short HEAD 2>/dev/null || echo "unknown")}
    image: ragsystem-backend:${TAG:-latest}
    container_name: ragsystem-backend
    restart: unless-stopped
    
    # 注入生产配置（宿主机上的 backend/.env，模板见 backend/.env.production.example）
    # ★ 配置生效机制说明：
    #   1) 后端代码只读容器内 <repo>/backend/.env（dotenv，优先于进程环境变量）；
    #   2) 镜像只 COPY 了 backend/app，容器内并不存在 .env 文件，
    #      因此 dotenv source 读不到值，自动回退到进程环境变量；
    #   3) 这里的 env_file 就是把 backend/.env 的内容注入为容器进程环境变量，从而生效。
    #   ⇒ 若用 volume 把整个仓库挂载进容器（含 backend/.env），则容器内 .env 优先，
    #     下方 environment 将无法覆盖它，请注意二者的取舍。
    env_file:
      - ../backend/.env
    
    # 环境变量（覆盖 env_file 中的值 —— 容器网络下 127.0.0.1 指向容器自身，
    # 必须改用 compose 服务名 postgres；MinerU 若在宿主机，用 host.docker.internal）
    environment:
      - RAG_DATA_ROOT=/opt/ragsystem/data
      - RAG_LOG_LEVEL=${RAG_LOG_LEVEL:-info}
      # ★ 关键：数据库主机指向 compose 内的 postgres 服务，而非 backend/.env 里的 127.0.0.1
      - RAG_PG_HOST=${PG_SERVICE_HOST:-postgres}
      - RAG_PG_DBNAME=${PG_DBNAME:-ragsystem_production}
      - RAG_PG_USER=${PG_USER:-ragsystem_app}
      - RAG_PG_PASSWORD=${PG_PASSWORD:-ragsystem_password}
      # ★ MinerU：若部署在宿主机（非容器），改用 host.docker.internal:7860
      # - RAG_MINERU_API_URL=http://host.docker.internal:7860
    
    # Linux 下允许容器访问宿主机服务（MinerU 等）
    extra_hosts:
      - "host.docker.internal:host-gateway"
    
    # 数据卷（持久化解析文件、chunks 等）
    volumes:
      - ragsystem_data:/opt/ragsystem/data
      - ragsystem_logs:/opt/ragsystem/backend/logs
    
    # 健康检查
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    
    # 资源限制（防止占用过多内存）
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 4G
        reservations:
          cpus: '1.0'
          memory: 1G
    
    # ★ 依赖数据库就绪后再启动（避免建表失败）
    depends_on:
      postgres:
        condition: service_healthy
    
    networks:
      - ragsystem-network

  # ──── 前端服务（React + Nginx）─────────────────
  frontend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
        BUILD_DATE: ${BUILD_DATE:-$(date -u +'%Y-%m-%dT%H:%M:%SZ')}
        VCS_REF: ${VCS_REF:-$(git rev-parse --short HEAD 2>/dev/null || echo "unknown")}
    image: ragsystem-frontend:${TAG:-latest}
    container_name: ragsystem-frontend
    restart: unless-stopped
    
    # 端口映射（仅用于独立部署，分离部署时由外部 Nginx 代理）
    ports:
      - ${FRONTEND_PORT:-80}:80
    
    # 健康检查
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    
    depends_on:
      backend:
        condition: service_started
    
    networks:
      - ragsystem-network

  # ──── PostgreSQL 数据库─────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: ragsystem-postgres
    restart: unless-stopped
    
    # 数据库初始化
    environment:
      POSTGRES_DB: ${PG_DBNAME:-ragsystem_production}
      POSTGRES_USER: ${PG_USER:-ragsystem_app}
      POSTGRES_PASSWORD: ${PG_PASSWORD:-ragsystem_password}
    
    # 数据持久化
    volumes:
      - pg_data:/var/lib/postgresql/data
      # 挂载自定义 init 脚本（可选）
      # - ./init-scripts:/docker-entrypoint-initdb.d
    
    # 性能调优（容器环境）
    command: >
      postgres
      -c max_connections=${PG_MAX_CONNECTIONS:-100}
      -c shared_buffers=${PG_SHARED_BUFFERS:-256MB}
      -c effective_cache_size=${PG_EFFECTIVE_CACHE_SIZE:-1GB}
      -c maintenance_work_mem=${PG_MAINTENANCE_WORK_MEM:-128MB}
      -c checkpoint_completion_target=0.9
      -c fsync=on
      -c wal_level=replica
      -c synchronous_commit=on
    
    # 健康检查
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-ragsystem_app} -d ${PG_DBNAME:-ragsystem_production}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    
    # 资源限制
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    
    networks:
      - ragsystem-network

  # ──── Nginx 反向代理（可选，生产环境推荐）────────
  nginx:
    image: nginx:alpine
    container_name: ragsystem-nginx
    restart: unless-stopped
    
    # 挂载 Nginx 配置
    volumes:
      - ./nginx-ragsystem.conf:/etc/nginx/conf.d/default.conf:ro
    
    # 端口映射
    ports:
      - ${NGINX_HTTP_PORT:-80}:80
      - ${NGINX_HTTPS_PORT:-443}:443
    
    # SSL 证书挂载（可选，生产环境需提前获取证书）
    # volumes:
    #   - ./ssl:/etc/nginx/ssl:ro
    
    # 健康检查
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
    
    depends_on:
      - backend
      - frontend
    
    networks:
      - ragsystem-network

# ──── 网络─────────────────────────────────────
networks:
  ragsystem-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

# ──── 数据卷─────────────────────────────────────
volumes:
  pg_data:
    driver: local
    name: ragsystem_pg_data
  
  ragsystem_data:
    driver: local
    name: ragsystem_data
  
  ragsystem_logs:
    driver: local
    name: ragsystem_logs
