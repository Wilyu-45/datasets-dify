# ═══════════════════════════════════════════
# 仅后端部署覆盖文件（backend-only override）
#
# 用法（与主 compose 文件一起使用）：
#   docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.backend-only.yml up -d --build backend
#
# 作用：
#   - 把后端 8000 端口映射到宿主机 18000（主 compose 中 backend 无 ports，
#     默认仅通过 nginx/frontend 内网访问）
#   - ★ 选用 18000 而非 8000：本机 [::1]:8000 被 Windows 系统进程
#     （dllhost.exe，COM Surrogate）占用，会接受 TCP 连接但不响应 HTTP，
#     导致 localhost:8000 请求超时
#   - 验证服务：curl http://localhost:18000/api/health
# ═══════════════════════════════════════════

services:
  backend:
    ports:
      - "18000:8000"
