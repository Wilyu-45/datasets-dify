# ═══════════════════════════════════════════
# Nginx 配置文件示例（生产环境）
# 
# ★ 模式一：独立部署（后端同时服务前端 dist/ + API）
#   - RAG_SERVE_FRONTEND=true（默认），Nginx 只需一个 location /
# 
# ★ 模式二：前后端分离部署（生产方定制前端）
#   - RAG_SERVE_FRONTEND=false，Nginx 分别代理前端页面与后端 API
#     （例如：静态前端在 http://frontend.rag.example.com/，后端 API 在 http://api.rag.example.com/api/）
# 
# 复制本文件到 /etc/nginx/sites-available/ragsystem.conf
# ln -s /etc/nginx/sites-available/ragsystem.conf /etc/nginx/sites-enabled/
# nginx -t && systemctl reload nginx
# ═══════════════════════════════════════════

# ──── 模式一：独立部署 ───────────────────────────────────────────────
server {
    listen 80;
    server_name rag.example.com;

    # 安全头
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # 客户端最大上传大小（单文件支持大 PDF / DOCX）
    client_max_body_size 200m;

    # ── 日志 ──
    access_log /var/log/nginx/ragsystem.access.log;
    error_log  /var/log/nginx/ragsystem.error.log warn;

    # ── 后端 API + 前端 dist（RAG_SERVE_FRONTEND=true 时有效）──
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket 支持（可选，MinerU 等远程服务可能需要）
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # 超时设置（大文件解析可能耗时较长）
        proxy_read_timeout 3600s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 3600s;
    }

    # ── 静态资源缓存优化 ──
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        proxy_pass http://127.0.0.1:8000;
        expires 30d;
        add_header Cache-Control "public, immutable";
        proxy_cache_valid 200 60m;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
    }

    # ── OpenAPI 文档（仅内部调试时开启）──
    # location /docs {
    #     proxy_pass http://127.0.0.1:8000/docs;
    # }
}


# ──── 模式二：前后端分离部署 ───────────────────────────────────────────────
# 适用场景：生产方定制了自己的前端，需要部署到独立域名
# - 前端站点: http://frontend.rag.example.com
# - 后端 API: http://api.rag.example.com
# - 后端 .env: RAG_SERVE_FRONTEND=false, RAG_CORS_ORIGINS=["http://frontend.rag.example.com"]

server {
    listen 80;
    server_name api.rag.example.com;

    # 安全头
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;

    # ── 日志 ──
    access_log /var/log/nginx/ragsystem-api.access.log;
    error_log  /var/log/nginx/ragsystem-api.error.log warn;

    # ── 后端 API ──
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 超时设置
        proxy_read_timeout 3600s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 3600s;
    }
}

server {
    listen 80;
    server_name frontend.rag.example.com;

    # 前端页面（生产方定制的静态 HTML/JS）
    root /var/www/ragsystem-frontend;  # 放置 npm run build 后的产物
    index index.html;

    # SPA 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── 代理 API 请求到后端 ──
    location /api/ {
        proxy_pass http://api.rag.example.com/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── 静态资源缓存 ──
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}


# ──── 模式三：子路径部署（如 https://host/rag/） ──────────────────────────────────────
# 适用场景：多应用共享同一域名，RAG 系统部署在子路径下
# 需在前端 .env 设 VITE_BASE_PATH=/rag/

server {
    listen 80;
    server_name host.example.com;

    # ── RAG 系统子路径 ──
    location /rag/ {
        proxy_pass http://127.0.0.1:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 3600s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 3600s;
    }

    # ── 其他应用可放在同级路径 ──
    # location /other-app/ { ... }
}
