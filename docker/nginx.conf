# ═══════════════════════════════════════════
# 前端 Nginx 站点配置（容器内 /etc/nginx/conf.d/default.conf）
#
# 职责：
#   1) 托管 React 构建产物（SPA，history 路由回退到 index.html）
#   2) 同源反向代理：/api → backend:8000（业务接口 / 文件流 / Office 预览）
#                    /static → backend:8000（图片静态托管 /static/output/*）
#
# ★ 前端与 API 同源，浏览器无跨域问题，后端 CORS 可不依赖。
# ═══════════════════════════════════════════

# 后端上游（compose 服务名 backend，Docker 内置 DNS 解析）
upstream ragsystem_backend {
    server backend:8000;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 支持大文件上传（PDF / DOCX 等）
    client_max_body_size 200m;

    # gzip 压缩静态资源
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1024;

    # ── 业务 API 反向代理 ──
    location /api/ {
        proxy_pass http://ragsystem_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 大文件解析 / 入库耗时较长，放宽超时（与后端 MinerU 超时量级对齐）
        proxy_connect_timeout 60s;
        proxy_read_timeout    3600s;
        proxy_send_timeout    3600s;

        # 上传大文件时不缓冲请求体，直接透传后端，降低内存占用
        proxy_request_buffering off;
    }

    # ── 图片静态托管反向代理（/static/output/*）──
    location /static/ {
        proxy_pass http://ragsystem_backend;
        proxy_set_header Host            $host;
        proxy_set_header X-Real-IP       $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ── 带 hash 的构建产物长缓存 ──
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    # ── SPA history 路由回退 ──
    location / {
        try_files $uri $uri/ /index.html;
    }
}
